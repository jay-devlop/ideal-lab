<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이상형</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=26">
</head>
<body>
<h1>이상형</h1>
<nav class="tabs">
  <button class="tab active" data-pane="pane-make">구절판 만들기</button>
  <button class="tab" data-pane="pane-list">이상형 리스트</button>
  <button class="tab" data-pane="pane-game">밸런스게임</button>
</nav>
<section class="pane active" id="pane-make">
<p class="sub">번호를 클릭해 선택하고, 한 번 더 클릭하면 사진을 고릅니다. 붙여넣기(⌘+V)·파일 끌어놓기도 가능해요.<br>사진: 드래그로 위치, 휠로 크기, 꾹 누른 뒤 끌면 다른 번호로 이동, Delete로 삭제</p>
<div class="board"><svg id="board" viewBox="0 0 676 676"></svg></div>
<div class="bar">
  <div class="status" id="status"></div>
  <button id="pick">사진 업로드</button>
  <button id="save">구절판 저장</button>
</div>
</section>
<section class="pane" id="pane-list">
  <div class="listwrap">
    <div class="addrow"><input id="newItem" maxlength="60" placeholder="자신의 이상형을 적어보세요"><button id="addItem">등록</button></div>
    <div class="ibox">
      <p class="empty" id="listEmpty">아직 등록한 이상형이 없어요.</p>
      <ul class="ilist" id="list"></ul>
    </div>
  </div>
</section>
<section class="pane" id="pane-game">
  <div class="gamewrap">
    <div class="gbar">
      <label>문항 수
        <select id="qCount"></select>
      </label>
      <button id="gStart">게임 시작 &rarr;</button>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</section>
<div class="modal" id="confirm" hidden>
  <div class="dialog">
    <p class="dq">삭제하시겠습니까?</p>
    <p class="dnote">복구가 되지 않습니다.</p>
    <div class="dbtns"><button id="cNo">취소</button><button id="cYes" class="danger">삭제</button></div>
  </div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script src="gujeolpan.js?v=26"></script>
<script src="list.js?v=26"></script>
<script src="gamelist.js?v=26"></script>
<script src="game.js?v=26"></script>
<script src="main.js?v=26"></script>
</body>
</html>
