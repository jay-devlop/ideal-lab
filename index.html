<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideal Lab</title>
<meta name="description" content="이상형을 구절판으로 만들고 밸런스게임으로 모아 보세요">
<meta property="og:type" content="website">
<meta property="og:title" content="Ideal Lab">
<meta property="og:description" content="이상형을 구절판으로 만들고 밸런스게임으로 모아 보세요">
<meta property="og:image" content="https://ideal-lab.vercel.app/vintage/cupid_back.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://ideal-lab.vercel.app/vintage/cupid_back.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/style.css?v=71">
</head>
<body>
<img class="cupid" src="vintage/cupid_back.png" alt="">
<h1>이상형</h1>
<nav class="tabs">
  <button class="tab active" data-pane="pane-make">구절판 만들기</button>
  <button class="tab" data-pane="pane-list">이상형 리스트</button>
  <button class="tab" data-pane="pane-game">밸런스게임</button>
</nav>
<section class="pane active" id="pane-make">
<p class="sub">번호를 클릭해 선택하고, 한 번 더 클릭하여 사진을 고릅니다.<br>휠로 크기 조절, 복사붙여넣기, Delete로 삭제 가능</p>
<div class="board"><svg id="board" viewBox="0 0 676 676"></svg></div>
<div class="bar">
  <div class="status" id="status"></div>
  <button id="pick">사진 업로드</button>
  <button id="save">구절판 저장</button>
</div>
</section>
<section class="pane" id="pane-list">
  <div class="listwrap">
    <div class="addrow"><input id="newItem" maxlength="60" placeholder="자신의 이상형을 적어보세요"><button id="addItem">등록</button></div>
    <div class="ibox">
      <p class="empty" id="listEmpty">아직 등록한 이상형이 없어요.</p>
      <ul class="ilist" id="list"></ul>
    </div>
  </div>
</section>
<section class="pane" id="pane-game">
  <div class="gamewrap">
    <div class="gbar">
      <label>문항 수
        <select id="qCount"></select>
      </label>
      <button id="gStart">게임 시작 &rarr;</button>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</section>
<div class="modal" id="popup" hidden><div class="dialog"></div></div>
<section class="rococo gold" id="rococo" hidden>
  <div class="rbg"></div>
  <img class="rcupid" src="vintage/cupid.png" alt="">
  <img class="rswan" src="vintage/swan.png" alt="">
  <div class="rstage">
  <div class="board"><svg id="board2" viewBox="0 0 676 676"></svg><img class="frame" src="vintage/frame_open.png" alt=""></div>
  <div class="bar">
    <div class="status" id="status2"></div>
    <button id="pick2">사진 업로드</button>
    <button id="save2">구절판 저장</button>
  </div>
  <input type="file" id="file2" accept="image/*" multiple hidden>
  </div>
  <button id="rococoBack" aria-label="돌아가기">&larr;</button>
</section>
<input type="file" id="file" accept="image/*" multiple hidden>
<script src="pages/gujeolpan.js?v=71"></script>
<script src="common/popup.js?v=71"></script>
<script src="ai/dedupe.js?v=71"></script>
<script src="pages/list.js?v=71"></script>
<script src="data/gamelist.js?v=71"></script>
<script src="pages/game.js?v=71"></script>
<script src="common/main.js?v=71"></script>
<script src="pages/rococo.js?v=71"></script>
</body>
</html>
